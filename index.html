<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מתכנן טיול</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#e8eefc;--pri:#2563eb;--pri2:#1d4ed8;--card:#fff;--txt:#1e293b;--head:#1e3a8a;--bd:#cbd5e1;--soft:#eff6ff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
body.sakura{--bg:#fdf2f8;--pri:#db2777;--pri2:#be185d;--head:#9d174d;--bd:#fbcfe8;--soft:#fce7f3}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--txt);display:flex;flex-direction:column;height:100dvh;font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:1em}
button{cursor:pointer;border:none;border-radius:8px;padding:8px 12px;background:var(--pri);color:#fff;font-weight:600;min-height:36px}
button:hover{background:var(--pri2)}
button.ghost{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}
button.sm{padding:4px 8px;min-height:30px;font-size:.85em}
button.red{background:var(--bad)}
button.gray{background:#64748b}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:#fff;color:var(--txt)}
textarea{min-height:60px;resize:vertical}
label{display:block;font-size:.8em;font-weight:600;opacity:.75;margin:8px 0 3px}
.topbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.08);z-index:5}
.topbar h1{font-size:1.1em;margin:0;color:var(--head);flex:1}
#app{flex:1;min-height:0;display:flex}
.pane{overflow:auto;min-height:0;display:none;flex:1;flex-direction:column;padding:10px;gap:8px}
.pane.active{display:flex}
#paneMap{padding:0;position:relative}
#map{position:absolute;inset:0}
.bottomnav{display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
.bottomnav button{flex:1;background:transparent;color:var(--head);border-radius:0;padding:10px 4px;font-size:.9em}
.bottomnav button.on{background:var(--soft);color:var(--pri);border-top:3px solid var(--pri)}
@media(min-width:900px){
 #app{display:grid;grid-template-columns:330px minmax(380px,1.1fr) 1fr}
 .pane,.pane.active{display:flex}
 .bottomnav{display:none}
}
.card{background:var(--card);border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.06);padding:10px;border:1px solid var(--bd)}
.day{background:var(--card);border-radius:12px;border:1px solid var(--bd);overflow:hidden;flex-shrink:0}
.day.sel{border:2px solid var(--pri);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.dayhead{display:flex;align-items:center;gap:8px;padding:10px;cursor:pointer}
.dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.dayhead b{color:var(--head);white-space:nowrap}
.ttl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.85}
.meta{font-size:.8em;opacity:.7;white-space:nowrap}
.daybody{padding:0 10px 12px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.row>*{flex:1 1 auto}
.stop,.item{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--bd);border-radius:10px;padding:6px 8px;margin:3px 0}
.stop[draggable=true],.item[draggable=true]{cursor:grab}
.num{width:24px;height:24px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:.8em;font-weight:700;flex-shrink:0}
.sname{flex:1;min-width:0;display:flex;flex-direction:column;word-break:break-word}
.sname small{opacity:.65}
.sbtns{display:flex;gap:3px}
.sbtns button{padding:2px 7px;min-height:28px;background:rgba(0,0,0,.08);color:var(--txt)}
.leg{font-size:.78em;color:#64748b;padding:0 12px;margin:0}
.empty{padding:14px;text-align:center;opacity:.6;border:2px dashed var(--bd);border-radius:10px}
.bar{height:8px;background:#e2e8f0;border-radius:6px;overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%}
.ok{background:var(--ok)}.warn{background:var(--warn)}.bad{background:var(--bad)}
.near{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:8px;margin-top:8px}
.near b{font-size:.9em}
.pin{width:28px;height:28px;border-radius:50%;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.hotelpin{font-size:22px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.pop{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.maptools{position:absolute;top:10px;left:50px;z-index:600;display:flex;gap:6px;flex-wrap:wrap}
.maptools button{box-shadow:0 2px 6px rgba(0,0,0,.3)}
#pickbar{display:none;position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:700;background:#111827;color:#fff;padding:10px 14px;border-radius:12px;align-items:center;gap:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2000;display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.box{background:var(--card);width:100%;max-width:560px;max-height:88dvh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
@media(min-width:700px){.modal{align-items:center}.box{border-radius:16px}}
.box h3{margin:0 0 8px;color:var(--head)}
.res{padding:8px;border-bottom:1px solid var(--bd);display:flex;gap:8px;align-items:center}
.res div{flex:1;font-size:.9em}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:20px;z-index:3000;display:none;max-width:90%}
.tag{font-size:.7em;background:#fde68a;color:#78350f;border-radius:6px;padding:1px 5px}
button:disabled{opacity:.4;cursor:default}
.sheetbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:var(--soft);color:var(--txt);border:1px solid var(--bd);margin:4px 0;min-height:48px}
.sheetbtn:hover:not(:disabled){background:var(--bd)}
.row .sheetbtn{width:auto;flex:1 1 40%}
.res input[type=checkbox]{flex:0 0 auto}
/* מסכי מגע / טלפון: אזורי לחיצה של 44px ושדות 16px (מונע זום אוטומטי ב-iPhone) */
@media (max-width:899px),(pointer:coarse){
 button,button.sm,.sbtns button{min-height:44px;min-width:44px}
 input,select,textarea{font-size:16px;min-height:44px}
 input[type=checkbox]{min-height:0;width:24px;height:24px}
 .sbtns{gap:6px}
}
</style>
</head>
<body>
<div class="topbar">
  <h1 id="tripTitle">🇯🇵 מתכנן טיול</h1>
  <button class="ghost sm" data-act="add-day">+ יום</button>
  <button class="sm" data-act="settings">⚙️ הגדרות</button>
</div>

<div id="app">
  <section class="pane" id="paneBank">
    <div class="card">
      <label style="margin-top:0">📅 מוסיף ליום (לשינוי בחר יום אחר)</label>
      <select id="selDaySel" aria-label="יום נבחר"></select>
    </div>
    <div class="card">
      <b>➕ הוספת אטרקציה</b>
      <input id="newName" placeholder="שם המקום (למשל: Tokyo Skytree)" style="margin-top:6px">
      <div class="row">
        <button data-act="new-search">🔍 חפש במפה והוסף</button>
        <button class="ghost" data-act="new-plain">הוסף בלי מיקום</button>
      </div>
    </div>
    <div class="card" style="flex:1;display:flex;flex-direction:column;min-height:200px">
      <div style="display:flex;justify-content:space-between;align-items:center"><b>מאגר אטרקציות</b><span id="bankCount" class="meta"></span></div>
      <button class="ghost" id="autoLocBtn" data-act="auto-locate" style="display:none;margin-top:6px"></button>
      <div class="row">
        <input id="bankFilter" placeholder="סינון...">
        <select id="bankSort"><option value="added">לפי סדר הוספה</option><option value="near">קרוב ליום הנבחר</option></select>
      </div>
      <div id="bankList" style="overflow:auto;flex:1"></div>
    </div>
  </section>

  <section class="pane" id="paneDays"><div id="daysWrap" style="display:flex;flex-direction:column;gap:8px"></div></section>

  <section class="pane" id="paneMap">
    <div id="map"></div>
    <div class="maptools">
      <button class="sm" data-act="recs-map">💡 המלצות באזור</button>
      <button class="sm gray" data-act="toggle-all">👁️ הצג/הסתר הכל</button>
    </div>
    <div id="pickbar"><span>לחץ על המפה כדי לבחור מיקום</span><button class="sm red" data-act="pick-cancel">ביטול</button></div>
  </section>
</div>

<nav class="bottomnav">
  <button data-tab="paneBank">📋 מאגר</button>
  <button data-tab="paneDays" class="on">📅 ימים</button>
  <button data-tab="paneMap">🗺️ מפה</button>
</nav>

<div class="modal" id="modal"><div class="box" id="box"></div></div>
<div id="toast"></div>
<input type="file" id="file" accept=".json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
'use strict';
const LS='tripPlanner.v2';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);

/* ---------- state ---------- */
function defaults(){return{v:2,settings:{start:'2027-01-14',end:'2027-02-14',dayHours:10,startTime:'09:00',defDur:90,country:'jp',theme:'default'},places:[],days:[],hotels:{},selDay:null,bankSort:'added',showAll:true}}
function mkDay(){return{id:uid(),title:'',morning:'',evening:'',transport:'',logistics:'',notes:'',items:[]}}
function parseD(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function rangeN(st){return Math.max(1,Math.round((parseD(st.end)-parseD(st.start))/864e5)+1)}
let S=(function(){
  try{const r=localStorage.getItem(LS);if(r){const s=JSON.parse(r);const d=defaults();return Object.assign(d,s,{settings:Object.assign(d.settings,s.settings)})}}catch(e){}
  const d=defaults();for(let i=0;i<rangeN(d.settings);i++)d.days.push(mkDay());d.selDay=d.days[0].id;return d})();
let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast('שמירה אוטומטית נכשלה – הורד קובץ גיבוי')}},250)}
const P=id=>S.places.find(p=>p.id===id);
const D=id=>S.days.find(d=>d.id===id);
const hasLoc=p=>p&&typeof p.lat==='number'&&typeof p.lng==='number';
const dayIdx=pid=>S.days.findIndex(d=>d.items.includes(pid));
const color=i=>i<0?'#64748b':`hsl(${(i*47)%360} 65% 42%)`;
const hotelPt=n=>{n=(n||'').trim();return n&&S.hotels[n]?S.hotels[n]:null};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)}

/* ---------- geo ---------- */
function hav(a,b){const r=Math.PI/180,R=6371,dLa=(b.lat-a.lat)*r,dLo=(b.lng-a.lng)*r;const x=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function leg(a,b){if(!a||!b)return null;const km=hav(a,b)*1.3;let min,mode;
  if(km<1.6){min=km*13+2;mode='🚶'}else if(km<80){min=10+km/28*60;mode='🚆'}else{min=25+km/140*60;mode='🚄'}
  return{km,min:Math.round(min),mode}}
function cent(a){a=a.filter(hasLoc);if(!a.length)return null;return{lat:a.reduce((s,p)=>s+p.lat,0)/a.length,lng:a.reduce((s,p)=>s+p.lng,0)/a.length}}
const toMin=s=>{const[h,m]=(s||'09:00').split(':').map(Number);return h*60+m};
const fmtT=m=>{m=Math.round(m)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const fmtH=m=>{const h=Math.floor(m/60),r=Math.round(m%60);return h?`${h}ש׳ ${r?r+"ד'":''}`:`${r} ד'`};
function plan(d){
  const rows=[];let t=toMin(S.settings.startTime),prev=hotelPt(d.morning),travel=0,visit=0,unknown=0;
  d.items.map(P).filter(Boolean).forEach(p=>{
    const l=prev&&hasLoc(p)?leg(prev,p):null;if(l){t+=l.min;travel+=l.min}
    if(!hasLoc(p))unknown++;
    rows.push({p,l,start:t});t+=p.dur;visit+=p.dur;if(hasLoc(p))prev=p});
  const eh=hotelPt(d.evening);const back=prev&&eh?leg(prev,eh):null;if(back){t+=back.min;travel+=back.min}
  return{rows,back,end:t,travel,visit,total:travel+visit,unknown}}
function dayAnchor(d){return cent(d.items.map(P))||hotelPt(d.morning)||hotelPt(d.evening)}
function usedSet(){return new Set(S.days.flatMap(d=>d.items))}

function optimize(d){
  const ps=d.items.map(P).filter(Boolean),loc=ps.filter(hasLoc),rest=ps.filter(p=>!hasLoc(p));
  if(loc.length<2)return false;
  const start=hotelPt(d.morning),end=hotelPt(d.evening);let order=[],pool=[...loc],cur=start;
  if(!cur){cur=pool.shift();order.push(cur)}
  while(pool.length){let bi=0,bd=1e9;pool.forEach((p,i)=>{const x=hav(cur,p);if(x<bd){bd=x;bi=i}});cur=pool.splice(bi,1)[0];order.push(cur)}
  const cost=o=>{let s=0,pv=start;o.forEach(p=>{if(pv)s+=hav(pv,p);pv=p});if(end&&pv)s+=hav(pv,end);return s};
  let imp=true,g=0;while(imp&&g++<40){imp=false;
    for(let i=0;i<order.length-1;i++)for(let j=i+1;j<order.length;j++){
      const n=order.slice(0,i).concat(order.slice(i,j+1).reverse(),order.slice(j+1));
      if(cost(n)<cost(order)-1e-9){order=n;imp=true}}}
  d.items=order.concat(rest).map(p=>p.id);return true}
function autofill(d){
  const budget=S.settings.dayHours*60;const used=usedSet();
  let pool=S.places.filter(p=>hasLoc(p)&&!used.has(p.id));if(!pool.length)return 0;
  let anchor=dayAnchor(d);
  if(!anchor){let best=null,bc=-1;pool.forEach(p=>{const c=pool.filter(q=>hav(p,q)<12).length;if(c>bc){bc=c;best=p}});anchor=best}
  let added=0;
  while(pool.length){
    const c=pool.map(p=>({p,d:hav(anchor,p)})).sort((a,b)=>a.d-b.d)[0];
    if(c.d>20)break;
    d.items.push(c.p.id);optimize(d);
    if(plan(d).total>budget){d.items=d.items.filter(x=>x!==c.p.id);break}
    pool=pool.filter(x=>x.id!==c.p.id);added++;anchor=cent(d.items.map(P))||anchor}
  return added}

/* ---------- actions on data ---------- */
function removeFromDays(pid){S.days.forEach(d=>d.items=d.items.filter(x=>x!==pid))}
function addToDay(pid,dayId,before){
  const d=D(dayId);if(!d||!P(pid))return;removeFromDays(pid);
  const i=before?d.items.indexOf(before):-1;if(i>=0)d.items.splice(i,0,pid);else d.items.push(pid)}
function addPlace(o){const p=Object.assign({id:uid(),name:'',lat:null,lng:null,dur:S.settings.defDur,notes:''},o);S.places.push(p);return p}
function refresh(fit){save();renderSelBar();renderBankList();renderDays();renderMap(fit)}

/* ---------- rendering: days ---------- */
function stopsHtml(d){
  if(!d.items.length)return '<div class="empty">גרור לכאן אטרקציות, או הוסף מהמאגר / מההצעות</div>';
  const pl=plan(d),di=S.days.indexOf(d);let h='';
  pl.rows.forEach((r,i)=>{
    if(r.l)h+=`<p class="leg">${r.l.mode} ~${r.l.min} ד׳ · ${r.l.km.toFixed(1)} ק״מ</p>`;
    h+=`<div class="stop" draggable="true" data-pid="${r.p.id}"><span class="num" style="background:${color(di)}">${i+1}</span>
      <div class="sname"><b>${esc(r.p.name)}</b><small>${fmtT(r.start)} · ${r.p.dur} ד׳ ${hasLoc(r.p)?'':'· ❔ אין מיקום'}</small></div>
      <div class="sbtns"><button data-act="stop-menu" data-id="${r.p.id}" aria-label="פעולות לתחנה" title="פעולות">⋯</button></div></div>`});
  if(pl.back)h+=`<p class="leg">${pl.back.mode} חזרה למלון ~${pl.back.min} ד׳ · ${pl.back.km.toFixed(1)} ק״מ</p>`;
  return h}
function nearHtml(d){
  const a=dayAnchor(d);if(!a)return '<div class="near"><small>סמן מיקום לאטרקציות או למלון כדי לקבל הצעות קרובות.</small></div>';
  const used=usedSet(),pl=plan(d),left=S.settings.dayHours*60-pl.total;
  const c=S.places.filter(p=>hasLoc(p)&&!used.has(p.id)).map(p=>({p,km:hav(a,p)})).sort((x,y)=>x.km-y.km).slice(0,6);
  if(!c.length)return '<div class="near"><small>אין עוד אטרקציות ממוקמות במאגר.</small></div>';
  return `<div class="near"><b>📌 קרוב ליום הזה</b> <small>(נשאר ~${fmtH(Math.max(0,left))})</small>`+c.map(({p,km})=>
    `<div class="item" style="background:#fff"><div class="sname"><b>${esc(p.name)}</b><small>${km.toFixed(1)} ק״מ · ${p.dur} ד׳</small></div><button class="sm" data-act="add-sel" data-id="${p.id}">➕</button></div>`).join('')+'</div>'}
function renderDays(){
  const w=$('#daysWrap');let h='';
  S.days.forEach((d,i)=>{
    const sel=d.id===S.selDay,pl=plan(d),pct=pl.total/(S.settings.dayHours*60)*100;
    const cls=pct>100?'bad':pct>90?'warn':'ok';
    const ds=dayDateStr(i);
    h+=`<div class="day ${sel?'sel':''}" data-id="${d.id}"><div class="dayhead" data-act="sel-day" data-day="${d.id}">
      <span class="dot" style="background:${color(i)}"></span><b>יום ${i+1} · ${ds}</b><span class="ttl">${esc(d.title)}</span>
      <span class="meta">${d.items.length?d.items.length+' · '+fmtH(pl.total):''}</span></div>`;
    if(sel){
      const eh=d.evening&&S.hotels[d.evening.trim()];
      h+=`<div class="daybody">
      <div class="bar"><i class="${cls}" style="width:${Math.min(100,pct)}%"></i></div>
      <small>סיום משוער ${fmtT(pl.end)} · ביקורים ${fmtH(pl.visit)} + נסיעות ${fmtH(pl.travel)} מתוך ${S.settings.dayHours}ש׳ ${pl.unknown?`· <span class="tag">${pl.unknown} בלי מיקום</span>`:''}</small>
      <label>כותרת היום</label><input data-f="title" data-day="${d.id}" value="${esc(d.title)}" placeholder="למשל: נסיעה לקיוטו">
      <label>מלון בוקר</label><div style="display:flex;gap:6px"><input data-f="morning" data-day="${d.id}" value="${esc(d.morning)}" placeholder="איפה מתעוררים?"><button class="sm" data-act="hotel-loc" data-day="${d.id}" data-which="morning">${hotelPt(d.morning)?'✅':'📍'}</button></div>
      <label>✈️ טיסות / רכבות</label><input data-f="transport" data-day="${d.id}" value="${esc(d.transport)}">
      <label>🧳 לוגיסטיקה ומזוודות</label><input data-f="logistics" data-day="${d.id}" value="${esc(d.logistics)}">
      <label>אטרקציות (גרור, או השתמש בחצים)</label>${stopsHtml(d)}
      <div class="row"><button data-act="optimize" data-day="${d.id}">🧭 סדר מסלול חכם</button><button data-act="autofill" data-day="${d.id}">✨ מלא אוטומטית</button></div>
      <div class="row"><button class="ghost" data-act="gmaps-day" data-day="${d.id}">🗺️ נווט ב-Google Maps</button><button class="ghost" data-act="recs-day" data-day="${d.id}">💡 המלצות באזור</button><button class="ghost" data-act="show-map">הצג במפה</button></div>
      ${nearHtml(d)}
      <label>מלון לילה</label><div style="display:flex;gap:6px"><input data-f="evening" data-day="${d.id}" value="${esc(d.evening)}" placeholder="איפה ישנים?"><button class="sm" data-act="hotel-loc" data-day="${d.id}" data-which="evening">${eh?'✅':'📍'}</button></div>
      <label>📝 הערות</label><textarea data-f="notes" data-day="${d.id}">${esc(d.notes)}</textarea>

/* ---------- auto-locate (Nominatim, 1 request/second) ---------- */
function cleanQ(n){const q=String(n).replace(/\(.*?\)/g,' ').split(/\s*\+\s*|\s+-\s*|-\s+/)[0].replace(/\s+/g,' ').trim();return q||String(n).trim()}
function locTargets(){
  const t=S.places.filter(p=>!hasLoc(p)).map(p=>({kind:'place',id:p.id,label:p.name,q:cleanQ(p.name)}));
  const seen=new Set();
  S.days.forEach(d=>[d.morning,d.evening].forEach(n=>{n=(n||'').trim();
    if(!n||seen.has(n)||S.hotels[n]||!/[A-Za-z]/.test(n))return;seen.add(n);
    t.push({kind:'hotel',id:n,label:'🏨 '+n,q:n})}));
  return t}
function renderLocJob(){
  const j=locJob;if(!j||!$('#lj_list'))return;
  const n=j.items.length,done=j.items.filter(i=>i.state!=='wait'&&i.state!=='run').length,sel=j.items.filter(i=>i.ok&&i.res).length;
  const y=$('#box').scrollTop;
  const rows=j.items.map((it,i)=>{
    const st={wait:j.busy?'⏳ ממתין':'— לא נבדק',run:'🔎 מחפש...',err:'⚠️ שגיאת רשת',none:'❔ לא נמצא – אפשר למקם ידנית'}[it.state]||'';
    const sub=it.res?`<small dir="ltr" style="display:block;opacity:.8;text-align:right">${esc(it.res.display_name)}</small>`:`<small style="display:block">${st}</small>`;
    return `<div class="res"><input type="checkbox" data-lj="${i}" ${it.ok&&it.res?'checked':''} ${it.res?'':'disabled'}><div><b dir="auto">${esc(it.label)}</b>${it.kind==='place'&&it.q!==it.label?`<small> · חיפוש: <span dir="auto">${esc(it.q)}</span></small>`:''}${sub}</div></div>`}).join('');
  $('#lj_prog').style.width=(done/n*100)+'%';
  $('#lj_txt').textContent=`${done} מתוך ${n} נבדקו`;
  $('#lj_list').innerHTML=rows;
  $('#lj_btns').innerHTML=j.busy?'<button class="gray" data-act="lj-stop">עצור</button>':`<button data-act="lj-apply" ${sel?'':'disabled'}>החל ${sel} נבחרים</button><button class="gray" data-act="close">סגור</button>`;
  $('#box').scrollTop=y}
async function autoLocate(){
  const targets=locTargets();if(!targets.length){toast('אין מה למקם');return}
  const cc=S.settings.country?'&countrycodes='+encodeURIComponent(S.settings.country):'';
  const j=locJob={busy:true,cancel:false,items:targets.map(t=>Object.assign({res:null,ok:true,state:'wait'},t))};
  openModal(`<h3>📍 מיקום אוטומטי</h3><div class="bar"><i id="lj_prog" class="ok" style="width:0%"></i></div>
  <small id="lj_txt"></small><br><small>המערכת מחפשת לפי החלק הראשון בשם (לפני "+"). מקום מורכב יקבל מיקום משוער – אפשר לתקן אחר כך בעריכה. בדוק את התוצאות וסמן רק את הנכונות.</small>
  <div id="lj_list" style="margin-top:8px"></div><div class="row" id="lj_btns"></div>`);
  renderLocJob();let errs=0;
  for(const it of j.items){
    if(j.cancel)break;
    it.state='run';renderLocJob();
    try{
      const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=en&q=${encodeURIComponent(it.q)}${cc}`);
      if(!r.ok)throw new Error(r.status);
      const arr=await r.json();it.res=arr[0]||null;it.state=it.res?'found':'none';it.ok=!!it.res;errs=0;
    }catch(e){it.state='err';it.ok=false;if(++errs>=3){j.cancel=true;toast('נראה שיש בעיית רשת או חסימה זמנית – נסה שוב בעוד כמה דקות')}}
    renderLocJob();
    await new Promise(r=>setTimeout(r,1100))}
  j.busy=false;j.items.forEach(i=>{if(i.state==='run')i.state='wait'});renderLocJob()}

/* ---------- events ---------- */
const A={
 'stop-menu':t=>stopMenu(t.dataset.id),
 'm-up':()=>{mv(menuPid,-1);stopMenu(menuPid)},
 'm-down':()=>{mv(menuPid,1);stopMenu(menuPid)},
 'm-prev':()=>{const i=dayIdx(menuPid);if(i>0)moveTo(menuPid,S.days[i-1].id)},
 'm-next':()=>{const i=dayIdx(menuPid);if(i>=0&&i<S.days.length-1)moveTo(menuPid,S.days[i+1].id)},
 'm-bank':()=>{removeFromDays(menuPid);closeModal();refresh();toast('הוחזר למאגר')},
 'm-nav':()=>A['gmap-place']({dataset:{id:menuPid}}),
 'auto-locate':autoLocate,
 'lj-stop':()=>{if(locJob)locJob.cancel=true},
 'lj-apply':()=>{let np=0,nh=0;locJob.items.forEach(it=>{if(!it.ok||!it.res)return;const pt={lat:+it.res.lat,lng:+it.res.lon};
   if(it.kind==='place'){const p=P(it.id);if(p){p.lat=pt.lat;p.lng=pt.lng;np++}}else{S.hotels[it.id]=pt;nh++}});
   locJob=null;closeModal();refresh(true);toast(`מוקמו ${np} אטרקציות ו-${nh} מלונות`)},
 'sel-day':t=>{S.selDay=t.dataset.day;renderSelBar();renderDays();renderBankList();renderMap(true);document.querySelector(`.day[data-id="${S.selDay}"]`)?.scrollIntoView({block:'start'})},
 'add-day':()=>{const d=mkDay();S.days.push(d);S.selDay=d.id;const e=parseD(S.settings.start);e.setDate(e.getDate()+S.days.length-1);S.settings.end=`${e.getFullYear()}-${String(e.getMonth()+1).padStart(2,'0')}-${String(e.getDate()).padStart(2,'0')}`;refresh()},
 'del-day':t=>{if(confirm('למחוק את היום? האטרקציות יחזרו למאגר.')){S.days=S.days.filter(d=>d.id!==t.dataset.day);if(!S.days.length)S.days.push(mkDay());S.selDay=S.days[0].id;refresh(true)}},
 'add-sel':(t)=>{if(!S.selDay)return;addToDay(t.dataset.id,S.selDay);map&&map.closePopup();refresh();toast('נוסף ליום '+(S.days.findIndex(d=>d.id===S.selDay)+1))},
 'tobank':t=>{removeFromDays(t.dataset.id);refresh()},
 'up':t=>mv(t.dataset.id,-1),'down':t=>mv(t.dataset.id,1),
 'edit':t=>{map&&map.closePopup();editPlace(t.dataset.id)},
 'e-save':saveEdit,
 'e-del':()=>{if(confirm('למחוק לצמיתות?')){removeFromDays(editing);S.places=S.places.filter(p=>p.id!==editing);closeModal();refresh()}},
 'loc-search':()=>{const p=P(editing);const pid=editing;openSearch('חיפוש מיקום',p.name.replace(/\(.*?\)/g,'').split(/[+\-]/)[0].trim(),r=>{const q=P(pid);q.lat=+r.lat;q.lng=+r.lon;closeModal();refresh(true);toast('המיקום נשמר')})},
 'loc-pick':()=>{const pid=editing;pickOnMap(c=>{const q=P(pid);q.lat=c.lat;q.lng=c.lng;refresh(true);toast('המיקום נשמר')})},
 'loc-clear':()=>{const p=P(editing);p.lat=p.lng=null;refresh();editPlace(editing)},
 'close':closeModal,
 'do-search':doSearch,
 'pick-res':t=>{const r=lastRes[+t.dataset.i];searchCb&&searchCb(r)},
 'pick-map':()=>{const cb=searchCb;pickOnMap(c=>cb({lat:c.lat,lon:c.lng,name:null,display_name:'',_manual:true}))},
 'pick-cancel':()=>{pickCb=null;$('#pickbar').style.display='none'},
 'new-search':()=>{const q=$('#newName').value.trim();if(!q){toast('הקלד שם');return}
   openSearch('הוספת אטרקציה',q,r=>{addPlace({name:r._manual?q:(r.name||r.display_name.split(',')[0]),lat:+r.lat,lng:+r.lon});$('#newName').value='';closeModal();refresh(true);toast('נוסף למאגר')})},
 'new-plain':()=>{const q=$('#newName').value.trim();if(!q)return;addPlace({name:q});$('#newName').value='';refresh()},
 'hotel-loc':t=>{const d=D(t.dataset.day),w=t.dataset.which,n=(d[w]||'').trim();if(!n){toast('הקלד קודם שם מלון');return}
   openSearch('מיקום מלון',n+' hotel',r=>{S.hotels[n]={lat:+r.lat,lng:+r.lon};closeModal();refresh(true);toast('מיקום המלון נשמר')})},
 'optimize':t=>{const d=D(t.dataset.day);if(optimize(d)){refresh();toast('המסלול סודר לפי קרבה')}else toast('צריך לפחות 2 אטרקציות עם מיקום')},
 'autofill':t=>{const d=D(t.dataset.day);const n=autofill(d);refresh(true);toast(n?`נוספו ${n} אטרקציות קרובות`:'לא נמצאו אטרקציות ממוקמות קרובות שנכנסות בזמן')},
 'gmaps-day':t=>gmapsDay(D(t.dataset.day)),
 'gmap-place':t=>{const p=P(t.dataset.id);window.open(hasLoc(p)?`https://www.google.com/maps/search/?api=1&query=${ll(p)}`:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name)}`,'_blank')},
 'show-map':()=>{tab('paneMap');renderMap(true)},
 'recs-day':t=>{const d=D(t.dataset.day);recs(dayAnchor(d),'ליד היום הנבחר')},
 'recs-map':()=>{const c=map.getCenter();recs({lat:c.lat,lng:c.lng},'באזור המפה')},
 'rec-add':t=>{const x=lastRecs[+t.dataset.i];if(S.places.some(p=>p.name===x.name)){toast('כבר קיים');return}addPlace({name:x.name,lat:x.lat,lng:x.lng,notes:x.desc});refresh();toast('נוסף למאגר')},
 'toggle-all':()=>{S.showAll=!S.showAll;save();renderMap()},
 'settings':settingsModal,
 'g-save':()=>{const s=S.settings;s.start=$('#g_start').value||s.start;s.end=$('#g_end').value||s.end;s.startTime=$('#g_st').value||'09:00';s.dayHours=+$('#g_dh').value||10;s.defDur=+$('#g_dd').value||90;s.country=$('#g_cc').value.trim().toLowerCase();s.theme=$('#g_th').value;applyTheme();applyRange();closeModal();refresh()},
 'exp-json':()=>download('trip-plan.json',JSON.stringify(S),'application/json'),
 'imp-json':()=>$('#file').click(),
 'exp-kml':exportKml,
 'reset':()=>{if(confirm('למחוק הכל?')){localStorage.removeItem(LS);location.reload()}}
};
function mv(pid,dir){const d=S.days.find(x=>x.items.includes(pid));const i=d.items.indexOf(pid),j=i+dir;if(j<0||j>=d.items.length)return;[d.items[i],d.items[j]]=[d.items[j],d.items[i]];refresh()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&A[t.dataset.act]){A[t.dataset.act](t,e);return}
  const tb=e.target.closest('[data-tab]');if(tb)tab(tb.dataset.tab)});
$('#paneDays').addEventListener('input',e=>{const t=e.target,f=t.dataset.f;if(!f)return;const d=D(t.dataset.day);d[f]=t.value;
  if(f==='evening'){const n=S.days[S.days.indexOf(d)+1];if(n){n.morning=t.value;const el=document.querySelector(`[data-f="morning"][data-day="${n.id}"]`);if(el)el.value=t.value}}
  if(f==='title'){const el=document.querySelector(`.day[data-id="${d.id}"] .ttl`);if(el)el.textContent=t.value}
  save()});
$('#selDaySel').addEventListener('change',e=>{S.selDay=e.target.value;save();renderDays();renderBankList();renderMap(true)});
$('#box').addEventListener('change',e=>{const t=e.target;
  if(t.id==='m_day'&&t.value)moveTo(menuPid,t.value);
  else if(t.dataset.lj!==undefined&&locJob){locJob.items[+t.dataset.lj].ok=t.checked;renderLocJob()}});
$('#bankFilter').addEventListener('input',renderBankList);
$('#bankSort').addEventListener('change',renderBankList);
$('#s_q')?.addEventListener('keydown',()=>{});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='s_q')doSearch();if(e.key==='Enter'&&e.target.id==='newName')A['new-search']()});

/* drag & drop (desktop) */
document.addEventListener('dragstart',e=>{const el=e.target.closest('[data-pid][draggable]');if(el){e.dataTransfer.setData('text/plain',el.dataset.pid);e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{if(e.target.closest('.day,#bankList'))e.preventDefault()});
document.addEventListener('drop',e=>{const pid=e.dataTransfer.getData('text/plain');if(!P(pid))return;
  const stop=e.target.closest('.stop'),day=e.target.closest('.day');
  if(day){e.preventDefault();addToDay(pid,day.dataset.id,stop&&stop.dataset.pid!==pid?stop.dataset.pid:null);S.selDay=day.dataset.id;refresh()}
  else if(e.target.closest('#bankList')){e.preventDefault();removeFromDays(pid);refresh()}});

/* ---------- init ---------- */
$('#bankSort').value=S.bankSort||'added';
applyTheme();renderSelBar();renderBankList();renderDays();
tab('paneDays');
initMap();
</script>
</body>
</html>
