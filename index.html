<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מתכנן טיול</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#e8eefc;--pri:#2563eb;--pri2:#1d4ed8;--card:#fff;--txt:#1e293b;--head:#1e3a8a;--bd:#cbd5e1;--soft:#eff6ff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
body.sakura{--bg:#fdf2f8;--pri:#db2777;--pri2:#be185d;--head:#9d174d;--bd:#fbcfe8;--soft:#fce7f3}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--txt);display:flex;flex-direction:column;height:100dvh;font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:1em}
button{cursor:pointer;border:none;border-radius:8px;padding:8px 12px;background:var(--pri);color:#fff;font-weight:600;min-height:36px}
button:hover{background:var(--pri2)}
button:disabled{opacity:.4;cursor:default}
button.ghost{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}
button.sm{padding:4px 8px;min-height:30px;font-size:.85em}
button.red{background:var(--bad)}
button.gray{background:#64748b}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:#fff;color:var(--txt)}
textarea{min-height:60px;resize:vertical}
label{display:block;font-size:.87em;font-weight:600;opacity:.85;margin:8px 0 3px}
label.chk{display:flex;align-items:center;gap:8px;font-weight:500;opacity:1;margin:6px 0;font-size:1em}
label.chk input{width:24px;height:24px;flex:0 0 auto;min-height:0;padding:0}
hr{border:0;border-top:1px solid var(--bd);margin:10px 0}
a{color:var(--pri)}
.mute{opacity:.75}
.topbar{display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.08);z-index:5}
.topbar h1{font-size:1.1em;margin:0;color:var(--head);flex:1}
#app{flex:1;min-height:0;display:flex}
.pane{overflow:auto;min-height:0;display:none;flex:1;flex-direction:column;padding:10px;gap:8px}
.pane.active{display:flex}
#paneMap{padding:0;position:relative}
#map{position:absolute;inset:0}
.bottomnav{display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
.bottomnav button{flex:1;background:transparent;color:var(--head);border-radius:0;padding:10px 4px;font-size:.9em}
.bottomnav button.on{background:var(--soft);color:var(--pri);border-top:3px solid var(--pri)}
@media(min-width:900px){
 #app{display:grid;grid-template-columns:330px minmax(380px,1.1fr) 1fr}
 .pane,.pane.active{display:flex}
 .bottomnav{display:none}
}
.card{background:var(--card);border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.06);padding:10px;border:1px solid var(--bd)}
.day{background:var(--card);border-radius:12px;border:1px solid var(--bd);overflow:hidden;flex-shrink:0}
.day.sel{border:2px solid var(--pri);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.dayhead{display:flex;align-items:center;gap:8px;padding:10px;cursor:pointer}
.dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.dayhead b{color:var(--head);white-space:nowrap}
.ttl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.85}
.meta{font-size:.87em;opacity:.8;white-space:nowrap}
.daybody{padding:0 10px 12px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.row>*{flex:1 1 auto}
.stop,.item{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--bd);border-radius:10px;padding:6px 8px;margin:3px 0}
.stop[draggable=true],.item[draggable=true]{cursor:grab}
.num{width:24px;height:24px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:.8em;font-weight:700;flex-shrink:0}
.sname{flex:1;min-width:0;display:flex;flex-direction:column;word-break:break-word;cursor:pointer;text-align:start}
.sname small{font-size:.87em;opacity:.8}
.sbtns{display:flex;gap:3px}
.sbtns button{padding:2px 7px;min-height:28px;background:rgba(0,0,0,.08);color:var(--txt)}
.leg{font-size:.86em;color:#475569;padding:0 12px;margin:0}
.empty{padding:14px;text-align:center;opacity:.7;border:2px dashed var(--bd);border-radius:10px}
.bar{height:8px;background:#e2e8f0;border-radius:6px;overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%}
.bar>i.ok{background:var(--ok)}.bar>i.warn{background:var(--warn)}.bar>i.bad{background:var(--bad)}
.loadtxt{font-size:.92em;font-weight:600;color:#166534;margin:2px 0 6px}
.loadtxt.over{color:var(--bad)}
.near{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:8px;margin-top:8px}
.near b{font-size:.9em}
details.dd{margin-top:10px;border:1px solid var(--bd);border-radius:10px;padding:6px 10px;background:#fafcff}
details.dd summary{cursor:pointer;font-weight:700;color:var(--head);padding:6px 0;min-height:32px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.chip{display:inline-block;font-size:.8em;border-radius:999px;padding:1px 8px;font-weight:600;white-space:nowrap}
.c-ok{background:#dcfce7;color:#166534}.c-warn{background:#fef3c7;color:#92400e}.c-bad{background:#fee2e2;color:#991b1b}.c-mute{background:#e2e8f0;color:#334155}
.pin{width:28px;height:28px;border-radius:50%;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.hotelpin{font-size:22px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.pop{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.maptools{position:absolute;top:10px;left:50px;z-index:600;display:flex;gap:6px;flex-wrap:wrap}
.maptools button{box-shadow:0 2px 6px rgba(0,0,0,.3)}
.mapdays{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:650;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.95);padding:6px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.3);max-width:96%}
.mapdays span{font-weight:700;color:var(--head);padding:0 6px;max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mapnote{display:none;position:absolute;top:60px;left:50%;transform:translateX(-50%);z-index:700;background:#fef3c7;color:#92400e;padding:10px 14px;border-radius:10px;max-width:90%;text-align:center;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#pickbar{display:none;position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:700;background:#111827;color:#fff;padding:10px 14px;border-radius:12px;align-items:center;gap:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2000;display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.box{background:var(--card);width:100%;max-width:560px;max-height:88dvh;overflow:auto;border-radius:16px 16px 0 0;padding:16px;outline:none}
@media(min-width:700px){.modal{align-items:center}.box{border-radius:16px}}
.box h3{margin:0 0 8px;color:var(--head)}
.res{padding:8px;border-bottom:1px solid var(--bd);display:flex;gap:8px;align-items:center}
.res>div{flex:1;font-size:.92em;min-width:0}
.sheetbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:var(--soft);color:var(--txt);border:1px solid var(--bd);margin:4px 0;min-height:48px}
.sheetbtn:hover:not(:disabled){background:var(--bd)}
.row .sheetbtn{width:auto;flex:1 1 40%}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:20px;z-index:3000;display:none;max-width:90%;align-items:center;gap:10px}
#gqpill{display:none;position:fixed;bottom:76px;right:12px;z-index:1500;background:#0f172a;color:#fff;padding:6px 8px 6px 12px;border-radius:999px;align-items:center;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,.3);font-size:.9em}
.tag{font-size:.75em;background:#fde68a;color:#78350f;border-radius:6px;padding:1px 5px}
.badge{background:var(--bad);color:#fff;border-radius:999px;padding:0 6px;font-size:.8em;margin-inline-start:4px}
/* מסכי מגע / טלפון: אזורי לחיצה של 44px ושדות 16px (מונע זום אוטומטי ב-iPhone) */
@media (max-width:899px),(pointer:coarse){
 button,button.sm,.sbtns button{min-height:44px;min-width:44px}
 input,select,textarea{font-size:16px;min-height:44px}
 label.chk input[type=checkbox]{min-height:0}
 .sbtns{gap:6px}
 #gqpill{bottom:calc(76px + env(safe-area-inset-bottom))}
}
@media(min-width:900px){#gqpill{bottom:14px}#toast{bottom:20px}}
</style>
</head>
<body>
<div class="topbar">
  <h1 id="tripTitle">🇯🇵 מתכנן טיול</h1>
  <button class="ghost sm" data-act="bookings" aria-label="הזמנות וכרטיסים" title="הזמנות וכרטיסים">🎟️<span class="badge" id="bkCnt" style="display:none"></span></button>
  <button class="ghost sm" data-act="add-day" aria-label="הוסף יום">+ יום</button>
  <button class="sm" data-act="settings" aria-label="הגדרות">⚙️ הגדרות</button>
</div>

<div id="app">
  <section class="pane" id="paneBank">
    <div class="card">
      <label style="margin-top:0">📅 מוסיף ליום (לשינוי בחר יום אחר)</label>
      <select id="selDaySel" aria-label="יום נבחר"></select>
    </div>
    <div class="card">
      <b>➕ הוספת אטרקציה</b>
      <input id="newName" dir="auto" placeholder="שם המקום (למשל: Tokyo Skytree)" style="margin-top:6px" aria-label="שם המקום">
      <div class="row">
        <button data-act="new-plain">➕ הוסף ואתר אוטומטית</button>
        <button class="ghost" data-act="new-search">🔍 בחר מיקום בעצמי</button>
      </div>
      <small class="mute">המיקום, משך הביקור והתיאור נוספים אוטומטית (אפשר לתקן).</small>
    </div>
    <div class="card" style="flex:1;display:flex;flex-direction:column;min-height:200px">
      <div style="display:flex;justify-content:space-between;align-items:center"><b>מאגר אטרקציות</b><span id="bankCount" class="meta"></span></div>
      <button class="ghost" id="reportBtn" data-act="report" style="display:none;margin-top:6px"></button>
      <div class="row">
        <input id="bankFilter" dir="auto" placeholder="סינון..." aria-label="סינון המאגר">
        <select id="bankSort" aria-label="מיון"><option value="added">לפי סדר הוספה</option><option value="near">קרוב ליום הנבחר</option></select>
      </div>
      <div id="bankList" style="overflow:auto;flex:1"></div>
    </div>
  </section>

  <section class="pane" id="paneDays"><div id="daysWrap" style="display:flex;flex-direction:column;gap:8px"></div></section>

  <section class="pane" id="paneMap">
    <div id="map"></div>
    <div id="mapnote"></div>
    <div class="maptools">
      <button class="sm" data-act="recs-map">💡 המלצות באזור</button>
      <button class="sm gray" data-act="toggle-all" aria-label="הצג או הסתר את שאר הימים">👁️ ימים אחרים</button>
    </div>
    <div class="mapdays" id="mapdays">
      <button class="sm" data-act="map-prev">יום קודם</button><span id="mapDayLbl"></span><button class="sm" data-act="map-next">יום הבא</button>
    </div>
    <div id="pickbar"><span>לחץ על המפה כדי לבחור מיקום</span><button class="sm red" data-act="pick-cancel">ביטול</button></div>
  </section>
</div>

<nav class="bottomnav">
  <button data-tab="paneBank">📋 מאגר</button>
  <button data-tab="paneDays" class="on">📅 ימים</button>
  <button data-tab="paneMap">🗺️ מפה</button>
</nav>

<div class="modal" id="modal"><div class="box" id="box" role="dialog" aria-modal="true" tabindex="-1"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="gqpill" role="status"><span>🔎 <span id="gqtxt"></span></span><button class="sm gray" data-act="q-stop">עצור</button></div>
<input type="file" id="file" accept=".json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
'use strict';
const LS='tripPlanner.v2';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ================= מצב ================= */
function defaults(){return{v:3,settings:{start:'2027-01-14',end:'2027-02-14',dayHours:10,startTime:'09:00',defDur:90,country:'jp',theme:'default'},places:[],days:[],hotels:{},hotelNone:{},selDay:null,bankSort:'added',showAll:true}}
function mkDay(){return{id:uid(),title:'',morning:'',evening:'',transport:'',logistics:'',notes:'',items:[]}}
function parseD(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function rangeN(st){return Math.max(1,Math.round((parseD(st.end)-parseD(st.start))/864e5)+1)}
const hasLoc=p=>p&&typeof p.lat==='number'&&typeof p.lng==='number';
const hk=n=>String(n||'').toLowerCase().replace(/\s+/g,' ').trim();
let S=(function(){
  try{const r=localStorage.getItem(LS);if(r){const s=JSON.parse(r);const d=defaults();return Object.assign(d,s,{settings:Object.assign(d.settings,s.settings)})}}catch(e){}
  const d=defaults();for(let i=0;i<rangeN(d.settings);i++)d.days.push(mkDay());d.selDay=d.days[0].id;return d})();
const PD={desc:'',descSrc:'',descUrl:'',book:'',bookNote:'',bookAuto:true,booked:false,tickets:false,bookRef:'',bookTime:'',geo:'',geoName:'',geoConf:'',geoQ:'',geoQLow:false,wiki:'',cat:'',kbId:'',kbDone:0,enr:0};
function fixPlace(p){for(const k in PD)if(p[k]===undefined)p[k]=PD[k];
  if(p.durAuto===undefined)p.durAuto=(p.dur===(S.settings.defDur||90));
  if(hasLoc(p)&&!p.geo)p.geo='manual';return p}
function fixAll(){
  const h={};for(const k in S.hotels)h[hk(k)]=S.hotels[k];S.hotels=h;S.hotelNone=S.hotelNone||{};
  S.places.forEach(p=>{fixPlace(p);if(!p.kbDone)applyKB(p)});
  if(!S.days.length)S.days.push(mkDay());
  if(!S.days.some(d=>d.id===S.selDay))S.selDay=S.days[0].id}
let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast('שמירה אוטומטית נכשלה – הורד קובץ גיבוי')}},250)}
const P=id=>S.places.find(p=>p.id===id);
const D=id=>S.days.find(d=>d.id===id);
const dayIdx=pid=>S.days.findIndex(d=>d.items.includes(pid));
const color=i=>i<0?'#64748b':`hsl(${(i*47)%360} 65% 42%)`;
const hotelPt=n=>{const k=hk(n);return k?(S.hotels[k]||null):null};
let toastT;
function toast(m,undo){const t=$('#toast');t.innerHTML=esc(m)+(undo?' <button class="sm gray" data-act="undo">↩ בטל</button>':'');t.style.display='flex';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',undo?7000:2800)}
let undoSnap=null;
function undoable(label,fn){const s=JSON.stringify(S);fn();undoSnap=s;toast(label,true)}

/* ================= גיאוגרפיה ותכנון ================= */
function hav(a,b){const r=Math.PI/180,R=6371,dLa=(b.lat-a.lat)*r,dLo=(b.lng-a.lng)*r;const x=Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function leg(a,b){if(!a||!b)return null;const km=hav(a,b)*1.3;let min,mode;
  if(km<1.6){min=km*13+2;mode='🚶'}else if(km<80){min=10+km/28*60;mode='🚆'}else{min=25+km/140*60;mode='🚄'}
  return{km,min:Math.round(min),mode}}
function cent(a){a=a.filter(hasLoc);if(!a.length)return null;return{lat:a.reduce((s,p)=>s+p.lat,0)/a.length,lng:a.reduce((s,p)=>s+p.lng,0)/a.length}}
const toMin=s=>{const[h,m]=(s||'09:00').split(':').map(Number);return h*60+m};
const fmtT=m=>{m=Math.round(m)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const fmtH=m=>{const h=Math.floor(m/60),r=Math.round(m%60);return h?`${h}ש׳ ${r?r+"ד'":''}`:`${r} ד'`};
function plan(d){
  const rows=[];let t=toMin(S.settings.startTime),prev=hotelPt(d.morning),travel=0,visit=0,unknown=0;
  d.items.map(P).filter(Boolean).forEach(p=>{
    const l=prev&&hasLoc(p)?leg(prev,p):null;if(l){t+=l.min;travel+=l.min}
    if(!hasLoc(p))unknown++;
    rows.push({p,l,start:t});t+=p.dur;visit+=p.dur;if(hasLoc(p))prev=p});
  const eh=hotelPt(d.evening);const back=prev&&eh?leg(prev,eh):null;if(back){t+=back.min;travel+=back.min}
  return{rows,back,end:t,travel,visit,total:travel+visit,unknown}}
function dayAnchor(d){return cent(d.items.map(P))||hotelPt(d.morning)||hotelPt(d.evening)}
function usedSet(){return new Set(S.days.flatMap(d=>d.items))}
function optimize(d){
  const ps=d.items.map(P).filter(Boolean),loc=ps.filter(hasLoc),rest=ps.filter(p=>!hasLoc(p));
  if(loc.length<2)return false;
  const start=hotelPt(d.morning),end=hotelPt(d.evening);let order=[],pool=[...loc],cur=start;
  if(!cur){cur=pool.shift();order.push(cur)}
  while(pool.length){let bi=0,bd=1e9;pool.forEach((p,i)=>{const x=hav(cur,p);if(x<bd){bd=x;bi=i}});cur=pool.splice(bi,1)[0];order.push(cur)}
  const cost=o=>{let s=0,pv=start;o.forEach(p=>{if(pv)s+=hav(pv,p);pv=p});if(end&&pv)s+=hav(pv,end);return s};
  let imp=true,g=0;while(imp&&g++<40){imp=false;
    for(let i=0;i<order.length-1;i++)for(let j=i+1;j<order.length;j++){
      const n=order.slice(0,i).concat(order.slice(i,j+1).reverse(),order.slice(j+1));
      if(cost(n)<cost(order)-1e-9){order=n;imp=true}}}
  d.items=order.concat(rest).map(p=>p.id);return true}
function autofill(d){
  const budget=S.settings.dayHours*60;const used=usedSet();
  let pool=S.places.filter(p=>hasLoc(p)&&!used.has(p.id));if(!pool.length)return 0;
  let anchor=dayAnchor(d);
  if(!anchor){let best=null,bc=-1;pool.forEach(p=>{const c=pool.filter(q=>hav(p,q)<12).length;if(c>bc){bc=c;best=p}});anchor=best}
  let added=0;
  while(pool.length){
    const c=pool.map(p=>({p,d:hav(anchor,p)})).sort((a,b)=>a.d-b.d)[0];
    if(c.d>20)break;
    d.items.push(c.p.id);optimize(d);
    if(plan(d).total>budget){d.items=d.items.filter(x=>x!==c.p.id);break}
    pool=pool.filter(x=>x.id!==c.p.id);added++;anchor=cent(d.items.map(P))||anchor}
  return added}

/* ================= בסיס ידע: משך, תיאור, הזמנה מראש =================
   מידע כללי שנכתב מראש. לא תחליף לאתר הרשמי: שעות, מחירים והזמנות משתנים. */

function splitName(n){
  let s=String(n).trim(),area='';

function estimateFor(name){
  const {area,segs}=splitName(name);const find=s=>KB.find(k=>k.re.test(s));
  const hits=[],seen=new Set();let unmatched=0;
  if(area){const k=find(area);if(k){seen.add(k.id);hits.push({k,area:true})}}
  segs.forEach(s=>{const k=find(s);if(k){if(!seen.has(k.id)){seen.add(k.id);hits.push({k,area:false})}}else unmatched++});
  if(!hits.length)return null;
  let dur;
  if(hits.length===1)dur=hits[0].k.dur+unmatched*30;
  else{const sum=hits.reduce((a,h)=>a+(h.area?h.k.dur*0.4:h.k.dur),0)+unmatched*30;dur=Math.min(300,Math.max(60,Math.round(sum*0.75/15)*15))}

  const book=hits.reduce((b,h)=>rank[h.k.book]>rank[b]?h.k.book:b,'');
  const desc=hits.length>1?hits.map(h=>'• '+h.k.desc).join('\n'):hits[0].k.desc;
  const qh=hits.find(h=>h.k.q);
  return{ids:hits.map(h=>h.k.id),dur,desc,book,note:hits.map(h=>h.k.note).filter(Boolean).join(' · '),q:qh?qh.k.q:'',qLow:!!(qh&&qh.k.qLow)}}

  const cc=S.settings.country?'&countrycodes='+encodeURIComponent(S.settings.country):'';

async function taskHotel(name){

function clip(t,n=300){t=String(t).replace(/\s+/g,' ').trim();if(t.length<=n)return t;const cut=t.slice(0,n),i=Math.max(cut.lastIndexOf('. '),cut.lastIndexOf('; '));return (i>120?cut.slice(0,i+1):cut.trim()+'…')}

  const best=Object.values((j.query&&j.query.pages)||{}).filter(x=>x.extract).map(x=>({x,s:overlap(q,x.title)})).sort((a,b)=>b.s-a.s)[0];
  if(!best||best.s<0.5)return null;

let lastRecs=[];
async function recs(c,label){

  try{
    const u=`https://en.wikipedia.org/w/api.php?action=query&generator=geosearch&ggscoord=${c.lat}|${c.lng}&ggsradius=10000&ggslimit=30&prop=coordinates|description&colimit=30&format=json&origin=*`;
    const j=await (await fetch(u)).json();const pages=Object.values(j.query?.pages||{});
    lastRecs=pages.filter(x=>x.coordinates).map(x=>({name:x.title,lat:x.coordinates[0].lat,lng:x.coordinates[0].lon,desc:x.description||''})).map(x=>Object.assign(x,{km:hav(c,x)})).sort((a,b)=>a.km-b.km);
    $('#r_res').innerHTML=lastRecs.length?lastRecs.map((x,i)=>`<div class="res"><div><b><bdi>${esc(x.name)}</bdi></b><br><small>${esc(x.desc)} · ${x.km.toFixed(1)} ק״מ</small></div><button class="sm" data-act="rec-add" data-i="${i}">➕ למאגר</button></div>`).join(''):'<div class="empty">אין תוצאות באזור</div>'

const ll=p=>`${p.lat},${p.lng}`;
function gmapsDay(d){
  const pts=[];const mh=hotelPt(d.morning),eh=hotelPt(d.evening);if(mh)pts.push(mh);
  d.items.map(P).filter(hasLoc).forEach(p=>pts.push(p));if(eh)pts.push(eh);
  if(pts.length<2){toast('צריך לפחות שתי נקודות עם מיקום');return}
  const w=pts.slice(1,-1).slice(0,9).map(ll).join('|');
  window.open(`https://www.google.com/maps/dir/?api=1&origin=${ll(pts[0])}&destination=${ll(pts[pts.length-1])}${w?'&waypoints='+encodeURIComponent(w):''}&travelmode=transit`,'_blank','noopener');
  if(pts.length>11)toast('גוגל מקבל עד 9 תחנות ביניים – נשלחו הראשונות')}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function exportKml(){
  const pm=p=>hasLoc(p)?`<Placemark><name>${esc(p.name)}</name><description>${esc((p.desc?p.desc+'\n':'')+p.notes)}</description><Point><coordinates>${p.lng},${p.lat},0</coordinates></Point></Placemark>`:'';
  let k='<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>Trip</name>';
  S.days.forEach((d,i)=>{if(d.items.length)k+=`<Folder><name>יום ${i+1} ${esc(d.title)}</name>${d.items.map(P).map(pm).join('')}</Folder>`});
  k+=`<Folder><name>מאגר</name>${S.places.filter(p=>dayIdx(p.id)<0).map(pm).join('')}</Folder></Document></kml>`;
  download('trip.kml',k,'application/vnd.google-earth.kml+xml')}
function importLegacy(j){
  const st=defaults();st.settings.start=j.startDate||st.settings.start;if(j.theme)st.settings.theme=j.theme.replace('theme-','');
  const nm=el=>(el.querySelector('.attr-text')?.textContent??el.textContent).trim();
  const gv=(c,s)=>c.querySelector(s)?.getAttribute('data-val')||'';
  const doc=new DOMParser().parseFromString('<div>'+j.calendarHtml+'</div>','text/html');
  const mk=name=>({id:uid(),name,lat:null,lng:null,dur:st.settings.defDur,notes:''});
  doc.querySelectorAll('.day-card').forEach(c=>{
    const d=mkDay();d.title=gv(c,'.day-custom-title');d.morning=gv(c,'.morning-hotel');d.evening=gv(c,'.evening-hotel');d.notes=gv(c,'.notes-field');
    const others=[...c.querySelectorAll('input.save-state')].filter(x=>!x.matches('.day-custom-title,.morning-hotel,.evening-hotel'));
    d.transport=others[0]?.getAttribute('data-val')||'';d.logistics=others[1]?.getAttribute('data-val')||'';
    c.querySelectorAll('.attraction').forEach(a=>{const p=mk(nm(a));st.places.push(p);d.items.push(p.id)});
    st.days.push(d)});
  new DOMParser().parseFromString('<div>'+(j.bankHtml||'')+'</div>','text/html').querySelectorAll('.attraction').forEach(a=>st.places.push(mk(nm(a))));
  const e=parseD(st.settings.start);e.setDate(e.getDate()+st.days.length-1);
  st.settings.end=`${e.getFullYear()}-${String(e.getMonth()+1).padStart(2,'0')}-${String(e.getDate()).padStart(2,'0')}`;
  st.selDay=st.days[0]?.id;return st}

 'm-up':()=>{mv(menuPid,-1);stopMenu(menuPid)},
 'm-down':()=>{mv(menuPid,1);stopMenu(menuPid)},
 'm-prev':()=>{const i=dayIdx(menuPid);if(i>0)moveTo(menuPid,S.days[i-1].id)},
 'm-next':()=>{const i=dayIdx(menuPid);if(i>=0&&i<S.days.length-1)moveTo(menuPid,S.days[i+1].id)},
 'm-bank':()=>{undoable('הוחזר למאגר',()=>removeFromDays(menuPid));closeModal();refresh()},
 'm-nav':()=>A['gmap-place']({dataset:{id:menuPid}}),
 'edit':t=>{map&&map.closePopup();editPlace(t.dataset.id)},
 'e-save':saveEdit,
 'e-del':()=>{if(confirm('למחוק לצמיתות?')){const id=editing;undoable('האטרקציה נמחקה',()=>{removeFromDays(id);S.places=S.places.filter(p=>p.id!==id)});closeModal();refresh()}},
 'loc-auto':()=>{const p=P(editing);p.lat=p.lng=null;p.geo='';p.geoConf='';p.geoName='';p.geoQ='';applyKB(p);qAdd('geo',p.id);closeModal();refresh();toast('מאתר מחדש…')},
 'loc-search':()=>{const p=P(editing),pid=editing;openSearch('חיפוש מיקום',splitName(p.name).segs[0].replace(/\(.*?\)/g,'').trim(),r=>{const q=P(pid);q.lat=+r.lat;q.lng=+r.lon;q.geo='manual';q.geoName=r.display_name||'';q.geoConf='high';closeModal();refresh(true);enqueuePlace(q);toast('המיקום נשמר')})},
 'loc-pick':()=>{const pid=editing;pickOnMap(c=>{const q=P(pid);q.lat=c.lat;q.lng=c.lng;q.geo='manual';q.geoName='נבחר ידנית במפה';q.geoConf='high';refresh(true);enqueuePlace(q);editPlace(pid)})},
 'loc-clear':()=>{const p=P(editing);p.lat=p.lng=null;p.geo='manual-none';p.geoConf='';p.geoName='';refresh();editPlace(editing)},
 'close':closeModal,
 'do-search':doSearch,
 'pick-res':t=>{const r=lastRes[+t.dataset.i];searchCb&&searchCb(r)},
 'pick-map':()=>{const cb=searchCb;pickOnMap(c=>cb({lat:c.lat,lon:c.lng,name:null,display_name:'',_manual:true}))},
 'pick-cancel':()=>{pickCb=null;endPick();tab(pickReturn)},
 'new-search':()=>{const q=$('#newName').value.trim();if(!q){toast('הקלד שם');return}
   openSearch('הוספת אטרקציה',q,r=>{addPlace({name:r._manual?q:(r.name||r.display_name.split(',')[0]),lat:+r.lat,lng:+r.lon,geo:'manual',geoName:r.display_name||'',geoConf:'high'});$('#newName').value='';closeModal();refresh(true);toast('נוסף למאגר')})},
 'new-plain':()=>{const q=$('#newName').value.trim();if(!q){toast('הקלד שם');return}addPlace({name:q});$('#newName').value='';refresh();toast('נוסף. מאתר מיקום ומידע…')},
 'hotel-loc':t=>{const d=D(t.dataset.day),w=t.dataset.which,n=(d[w]||'').trim();if(!n){toast('הקלד קודם שם מלון');return}
   openSearch('מיקום מלון',n+' hotel',r=>{S.hotels[hk(n)]={lat:+r.lat,lng:+r.lon};delete S.hotelNone[hk(n)];closeModal();refresh(true);toast('מיקום המלון נשמר')})},
 'rp-hotel':t=>{const n=t.dataset.name;openSearch('מיקום מלון',n+' hotel',r=>{S.hotels[hk(n)]={lat:+r.lat,lng:+r.lon};delete S.hotelNone[hk(n)];closeModal();refresh(true);reportModal()})},
 'optimize':t=>{const d=D(t.dataset.day);if(d.items.length<2||d.items.map(P).filter(hasLoc).length<2){toast('צריך לפחות 2 אטרקציות עם מיקום');return}undoable('המסלול סודר לפי קרבה',()=>optimize(d));refresh()},
 'autofill':t=>{const d=D(t.dataset.day);let n=0;undoable('נוספו אטרקציות קרובות',()=>{n=autofill(d)});if(!n){undoSnap=null;toast('לא נמצאו אטרקציות ממוקמות קרובות שנכנסות בזמן')}refresh(true)},
 'gmaps-day':t=>gmapsDay(D(t.dataset.day)),
 'gmap-place':t=>{const p=P(t.dataset.id);if(!p)return;window.open(hasLoc(p)?`https://www.google.com/maps/search/?api=1&query=${ll(p)}`:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(splitName(p.name).segs[0]||p.name)}`,'_blank','noopener')},
 'show-map':()=>{tab('paneMap');renderMap(true)},
 'map-prev':()=>{const i=S.days.findIndex(d=>d.id===S.selDay);if(i>0)setSel(S.days[i-1].id)},
 'map-next':()=>{const i=S.days.findIndex(d=>d.id===S.selDay);if(i<S.days.length-1)setSel(S.days[i+1].id)},
 'recs-day':t=>recs(dayAnchor(D(t.dataset.day)),'ליד היום הנבחר'),
 'recs-map':()=>{if(!map){toast('המפה לא זמינה');return}const c=map.getCenter();recs({lat:c.lat,lng:c.lng},'באזור המפה')},
 'rec-add':t=>{const x=lastRecs[+t.dataset.i];if(S.places.some(p=>p.name===x.name)){toast('כבר קיים');return}addPlace({name:x.name,lat:x.lat,lng:x.lng,geo:'manual',geoConf:'high'});refresh();toast('נוסף למאגר')},
 'toggle-all':()=>{S.showAll=!S.showAll;save();renderMap()},
 'bookings':bookingsModal,
 'report':reportModal,
 'rp-ok':t=>{const p=P(t.dataset.id);p.geoConf='high';refresh();reportModal()},
 'rp-retry':t=>{const p=P(t.dataset.id);p.geo='';p.geoConf='';qAdd('geo',p.id);refresh();reportModal();toast('מנסה שוב…')},
 'rp-retry-all':()=>{S.places.filter(p=>p.geo==='none').forEach(p=>{p.geo='';qAdd('geo',p.id)});closeModal();refresh();toast('מנסה שוב…')},
 'q-stop':()=>{Q.stop=true;Q.items=[];renderPill()},
 'undo':()=>{if(!undoSnap)return;S=JSON.parse(undoSnap);undoSnap=null;fixAll();applyTheme();refresh(true);toast('בוטל')},
 'settings':settingsModal,
 'g-save':()=>{const s=S.settings;s.start=$('#g_start').value||s.start;s.end=$('#g_end').value||s.end;s.startTime=$('#g_st').value||'09:00';s.dayHours=+$('#g_dh').value||10;s.defDur=+$('#g_dd').value||90;s.country=$('#g_cc').value.trim().toLowerCase();s.theme=$('#g_th').value;applyTheme();applyRange();closeModal();refresh()},
 'reenrich':()=>{S.places.forEach(p=>applyKB(p));closeModal();refresh();startupQueue();toast('עודכן')},
 'exp-json':()=>download('trip-plan.json',JSON.stringify(S),'application/json'),
 'imp-json':()=>$('#file').click(),
 'exp-kml':exportKml,
 'reset':()=>{if(confirm('למחוק הכל?')){localStorage.removeItem(LS);location.reload()}}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&A[t.dataset.act]){A[t.dataset.act](t,e);return}
  const tb=e.target.closest('[data-tab]');if(tb)tab(tb.dataset.tab)});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(pickCb){A['pick-cancel']();return}if($('#modal').classList.contains('open')){closeModal();return}}
  if(e.key==='Tab'&&$('#modal').classList.contains('open')){
    const f=[...$('#box').querySelectorAll('button,select,input,textarea,a[href],[tabindex="0"]')].filter(x=>!x.disabled&&x.offsetParent!==null);
    if(f.length){const first=f[0],last=f[f.length-1];
      if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('#box'))){e.preventDefault();last.focus()}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.click()}
  if(e.key==='Enter'&&e.target.id==='s_q')doSearch();
  if(e.key==='Enter'&&e.target.id==='newName')A['new-plain']()});
$('#paneDays').addEventListener('focusin',e=>{const t=e.target;if(t.dataset&&t.dataset.f)t.dataset.orig=t.value});
$('#paneDays').addEventListener('input',e=>{const t=e.target,f=t.dataset.f;if(!f)return;const d=D(t.dataset.day);const old=d[f];d[f]=t.value;
  if(f==='evening'){const n=S.days[S.days.indexOf(d)+1];
    if(n&&(n.morning===''||n.morning===old)){n.morning=t.value;const el=document.querySelector(`[data-f="morning"][data-day="${n.id}"]`);if(el)el.value=t.value}}
  if(f==='title'){const el=document.querySelector(`.day[data-id="${d.id}"] .ttl bdi`);if(el)el.textContent=t.value}
  save()});
$('#paneDays').addEventListener('change',e=>{const t=e.target,f=t.dataset.f;if(f!=='morning'&&f!=='evening')return;
  const nu=t.value.trim(),orig=(t.dataset.orig||'').trim();
  if(nu&&hk(nu)!==hk(orig)&&!hotelPt(nu)){
    const stillUsed=[...hotelNames().keys()].includes(hk(orig));
    if(orig&&hotelPt(orig)&&!stillUsed&&lev(hk(orig),hk(nu))<=Math.max(2,Math.round(hk(orig).length*0.25))){
      S.hotels[hk(nu)]=S.hotels[hk(orig)];delete S.hotels[hk(orig)];toast('שם המלון עודכן והמיקום נשמר')}
    else ensureHotel(nu)}
  refresh()});
$('#daysWrap').addEventListener('toggle',e=>{const t=e.target;if(t.matches&&t.matches('details.dd'))detOpen[t.dataset.day]=t.open},true);
$('#selDaySel').addEventListener('change',e=>setSel(e.target.value));
$('#box').addEventListener('change',e=>{const t=e.target,id=t.id;
  if(id==='m_day'&&t.value){moveTo(menuPid,t.value);return}
  if(t.dataset.bk!==undefined){const q=P(t.dataset.bk);if(q){q.booked=t.checked;refresh();bookingsModal()}return}
  const p=infoPid&&P(infoPid);if(!p)return;
  if(id==='i_booked'){p.booked=t.checked;refresh()}
  else if(id==='i_tix'){p.tickets=t.checked;refresh()}
  else if(id==='i_ref'){p.bookRef=t.value;save()}
  else if(id==='i_time'){p.bookTime=t.value;save()}
  else if(id==='i_book'){p.book=t.value;p.bookAuto=false;refresh()}});
$('#bankFilter').addEventListener('input',renderBankList);
$('#bankSort').addEventListener('change',renderBankList);

/* גרור ושחרר (מחשב) */
document.addEventListener('dragstart',e=>{const el=e.target.closest('[data-pid][draggable]');if(el){e.dataTransfer.setData('text/plain',el.dataset.pid);e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{if(e.target.closest('.day,#bankList'))e.preventDefault()});
document.addEventListener('drop',e=>{const pid=e.dataTransfer.getData('text/plain');if(!P(pid))return;
  const stop=e.target.closest('.stop'),day=e.target.closest('.day');
  if(day){e.preventDefault();addToDay(pid,day.dataset.id,stop&&stop.dataset.pid!==pid?stop.dataset.pid:null);S.selDay=day.dataset.id;refresh()}
  else if(e.target.closest('#bankList')){e.preventDefault();removeFromDays(pid);refresh()}});

/* ================= אתחול ================= */
fixAll();
{const ti=todayIdx();if(ti>=0)S.selDay=S.days[ti].id}
$('#bankSort').value=S.bankSort||'added';
applyTheme();renderSelBar();renderBankList();renderDays();updateBkBadge();
tab('paneDays');
initMap();
startupQueue();
</script>
